  <!-- Log -->
  <div id="log-area">
    <div class="log-header">
      <h2>✅ 今日 Flow 已达成</h2>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="table">
        <svg class="icon">
          <use href="#icon-table"></use>
        </svg> 表格模式
      </button>
      <button class="tab-btn" data-tab="list">
        <svg class="icon">
          <use href="#icon-list"></use>
        </svg> 列表模式
      </button>
    </div>

    <pre class="log-content" id="log-content"></pre>

    <div class="log-actions">
      <button class="btn btn-primary" data-action="copy-log">复制到剪贴板</button>
      <button class="btn btn-secondary" data-action="restart">返回首页</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script>
    // ==================== Utils ====================
    const Utils = {
      uid() {
        if (window.crypto?.randomUUID) return crypto.randomUUID();
        return "id_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2);
      },
      clampInt(n, min, max) {
        const x = Number.parseInt(n, 10);
        if (Number.isNaN(x)) return min;
        return Math.min(max, Math.max(min, x));
      },
      deepClone(obj) {
        return JSON.parse(JSON.stringify(obj));
      },
      formatTime(date) {
        return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      },
      safeTrim(s) {
        return String(s ?? "").trim();
      }
    };

    // ==================== State ====================
    const State = {
      tasks: [],
      presets: [],
      currentPresetId: null,

      currentTaskIndex: 0,
      timeLeft: 0,
      isRunning: false,
      isPaused: false,
      isOvertime: false,
      overtimeSeconds: 0,

      logs: [],
      logMode: "table",

      taskStats: {
        pauses: 0,
        pauseDuration: 0, // seconds
        pauseStart: null, // timestamp ms
        startTime: null // timestamp ms
      },

      routineStartTime: null,

      // new: flashes / chime
      flashes: [], // { time, task, text }
      chimeMins: 0,
      routineActiveSeconds: 0,
      lastActiveUpdate: null,
      nextChimeAtActiveSeconds: null
    };

    // ==================== DOM ====================
    const DOM = {};
    function cacheDOM() {
      DOM.setupArea = document.getElementById("setup-area");
      DOM.runningArea = document.getElementById("running-area");
      DOM.logArea = document.getElementById("log-area");

      DOM.taskList = document.getElementById("task-list");
      DOM.presetList = document.getElementById("preset-list");

      DOM.saveModal = document.getElementById("save-modal");
      DOM.distractionModal = document.getElementById("distraction-modal");
      DOM.flashModal = document.getElementById("flash-modal");
      DOM.presetNameInput = document.getElementById("preset-name-input");
      DOM.customDistractionInput = document.getElementById("custom-distraction-input");
      DOM.distractionGrid = document.getElementById("distraction-grid");
      DOM.fileInput = document.getElementById("file-input");

      DOM.flashInput = document.getElementById("flash-input");
      DOM.flashChip = document.getElementById("flash-chip");
      DOM.chimeBtn = document.getElementById("chime-btn");
      DOM.chimeChip = document.getElementById("chime-chip");

      DOM.displayEmoji = document.getElementById("display-emoji");
      DOM.displayName = document.getElementById("display-name");
      DOM.displayTime = document.getElementById("display-time");
      DOM.statusMessage = document.getElementById("status-message");
      DOM.flowIndicator = document.getElementById("flow-indicator");
      DOM.overtimeLabel = document.getElementById("overtime-label");
      DOM.pauseBtn = document.getElementById("pause-btn");
      DOM.forgotBtn = document.getElementById("forgot-btn");

      DOM.etaProgress = document.getElementById("eta-progress");
      DOM.etaRemaining = document.getElementById("eta-remaining");
      DOM.etaFinish = document.getElementById("eta-finish");

      DOM.progressTrack = document.getElementById("progress-track");
      DOM.progressPercent = document.getElementById("progress-percent");

      DOM.panelTrigger = document.getElementById("panel-trigger");
      DOM.sidePanel = document.getElementById("side-panel");
      DOM.activeTaskSlot = document.getElementById("active-task-slot");
      DOM.futureTaskList = document.getElementById("future-task-list");

      DOM.logContent = document.getElementById("log-content");
      DOM.toast = document.getElementById("toast");

      DOM.emojiMeasure = document.getElementById("emoji-measure");

      // Mobile elements
      DOM.mobileActionBar = document.getElementById("mobile-action-bar");
      DOM.mobilePauseBtn = document.getElementById("mobile-pause-btn");
      DOM.mobilePauseIcon = document.getElementById("mobile-pause-icon");
      DOM.mobilePauseLabel = document.getElementById("mobile-pause-label");
      DOM.mobileForgotBtn = document.getElementById("mobile-forgot-btn");
      DOM.panelOverlay = document.getElementById("panel-overlay");
    }

    // ==================== Storage ====================
    const Storage = {
      keys: {
        tasks: "flow_v1_tasks",
        presets: "flow_v1_presets",
        currentPreset: "flow_v1_current_preset",
        chimeMins: "flow_v1_chime_mins"
      },

      defaultTasks() {
        return [
          { id: Utils.uid(), emoji: "☀️", name: "晨间伸展", mins: 5 },
          { id: Utils.uid(), emoji: "🍵", name: "喝一杯热水", mins: 2 },
          { id: Utils.uid(), emoji: "📝", name: "检查日程", mins: 5 }
        ];
      },

      defaultPresets() {
        return [
          {
            id: "morning",
            name: "晨间流程",
            tasks: [
              { id: Utils.uid(), emoji: "☀️", name: "晨间伸展", mins: 5 },
              { id: Utils.uid(), emoji: "🍵", name: "喝一杯热水", mins: 2 },
              { id: Utils.uid(), emoji: "📝", name: "检查日程", mins: 5 }
            ],
            createdAt: Date.now(),
            source: "builtin"
          },
          {
            id: "work",
            name: "工作启动",
            tasks: [
              { id: Utils.uid(), emoji: "🎯", name: "确定今日目标", mins: 3 },
              { id: Utils.uid(), emoji: "📧", name: "处理紧急邮件", mins: 10 },
              { id: Utils.uid(), emoji: "💻", name: "开始深度工作", mins: 45 }
            ],
            createdAt: Date.now(),
            source: "builtin"
          }
        ];
      },

      ensureTaskIds(tasks) {
        for (const t of tasks) {
          if (!t.id) t.id = Utils.uid();
          if (typeof t.emoji !== "string") t.emoji = "✨";
          if (typeof t.name !== "string") t.name = "新环节";
          t.mins = Utils.clampInt(t.mins, 1, 999);
        }
        return tasks;
      },

      load() {
        try {
          const tasksRaw = JSON.parse(localStorage.getItem(this.keys.tasks));
          const presetsRaw = JSON.parse(localStorage.getItem(this.keys.presets));
          State.tasks = Array.isArray(tasksRaw) ? this.ensureTaskIds(tasksRaw) : this.defaultTasks();
          State.presets = Array.isArray(presetsRaw) ? presetsRaw : this.defaultPresets();

          // presets 内任务也补 id（兼容旧导入）
          State.presets.forEach(p => {
            if (Array.isArray(p.tasks)) this.ensureTaskIds(p.tasks);
          });

          State.currentPresetId = localStorage.getItem(this.keys.currentPreset) || null;

          const chimeRaw = localStorage.getItem(this.keys.chimeMins);
          State.chimeMins = Utils.clampInt(chimeRaw ?? "0", 0, 60);
          if (![0, 15, 30, 60].includes(State.chimeMins)) State.chimeMins = 0;
        } catch (e) {
          console.warn("Storage load failed:", e);
          State.tasks = this.defaultTasks();
          State.presets = this.defaultPresets();
          State.currentPresetId = null;
          State.chimeMins = 0;
        }
      },

      saveTasks() {
        localStorage.setItem(this.keys.tasks, JSON.stringify(State.tasks));
      },
      savePresets() {
        localStorage.setItem(this.keys.presets, JSON.stringify(State.presets));
      },
      saveCurrentPreset() {
        if (State.currentPresetId) localStorage.setItem(this.keys.currentPreset, State.currentPresetId);
        else localStorage.removeItem(this.keys.currentPreset);
      },
      saveChime() {
        localStorage.setItem(this.keys.chimeMins, String(State.chimeMins));
      }
    };

    // ==================== Emoji auto width ====================
    const EmojiSizer = {
      // 给 emoji input 按内容自适应宽度（支持多个 emoji / ZWJ 序列）
      fit(inputEl) {
        if (!inputEl) return;
        const text = inputEl.value || "";
        DOM.emojiMeasure.textContent = text;

        // 基于测量 span 的宽度来设置 input width
        const measured = DOM.emojiMeasure.getBoundingClientRect().width;
        const padding = 22; // 左右 padding + 一点余量
        const min = 52;
        const max = 180;
        const w = Math.max(min, Math.min(max, Math.ceil(measured + padding)));
        inputEl.style.width = w + "px";
      },
      fitAll() {
        DOM.taskList.querySelectorAll("input.task-input-emoji").forEach(el => this.fit(el));
      }
    };

    // ==================== UI ====================
    const UI = {
      toast(message, type = "success") {
        DOM.toast.textContent = message;
        DOM.toast.classList.remove("success", "error", "show");
        DOM.toast.classList.add(type === "error" ? "error" : "success", "show");
        window.setTimeout(() => DOM.toast.classList.remove("show"), 2500);
      },

      showPage(page) {
        DOM.setupArea.style.display = page === "setup" ? "block" : "none";
        DOM.runningArea.style.display = page === "running" ? "block" : "none";
        DOM.logArea.style.display = page === "log" ? "block" : "none";
      },

      updatePanelTools() {
        // flash count
        const count = State.flashes.length;
        if (DOM.flashChip) DOM.flashChip.textContent = `${count} 条`;

        // chime state
        const map = { 0: "关闭", 15: "15m", 30: "30m", 60: "60m" };
        const label = map[State.chimeMins] ?? "关闭";
        if (DOM.chimeChip) DOM.chimeChip.textContent = label;
        if (DOM.chimeBtn) DOM.chimeBtn.classList.toggle("active", State.chimeMins > 0);
      },

      renderPresets() {
        DOM.presetList.replaceChildren();

        for (const p of State.presets) {
          const item = document.createElement("div");
          item.className = "preset-item" + (State.currentPresetId === p.id ? " active" : "");
          item.dataset.presetId = p.id;

          const info = document.createElement("div");
          info.className = "preset-info";

          const name = document.createElement("span");
          name.className = "preset-name";
          name.textContent = p.name;

          if (p.source === "imported") {
            const badge = document.createElement("span");
            badge.className = "preset-badge";
            badge.textContent = "导入";
            name.appendChild(badge);
          }

          const meta = document.createElement("span");
          meta.className = "preset-meta";
          const total = (p.tasks || []).reduce((a, t) => a + (Number(t.mins) || 0), 0);
          meta.textContent = `${(p.tasks || []).length} 步骤 · ${total} 分钟`;

          info.appendChild(name);
          info.appendChild(meta);

          const actions = document.createElement("div");
          actions.className = "preset-actions";

          const loadBtn = document.createElement("button");
          loadBtn.className = "btn-icon";
          loadBtn.dataset.action = "load-preset";
          loadBtn.dataset.id = p.id;
          loadBtn.title = "加载";
          loadBtn.innerHTML = `<svg class="icon" style="color:var(--accent-success)"><use href="#icon-upload"></use></svg>`;

          const delBtn = document.createElement("button");
          delBtn.className = "btn-icon";
          delBtn.dataset.action = "delete-preset";
          delBtn.dataset.id = p.id;
          delBtn.title = "删除";
          delBtn.innerHTML = `<svg class="icon" style="color:var(--accent-danger)"><use href="#icon-delete"></use></svg>`;

          actions.appendChild(loadBtn);
          actions.appendChild(delBtn);

          item.appendChild(info);
          item.appendChild(actions);

          DOM.presetList.appendChild(item);
        }
      },

      renderTasks() {
        DOM.taskList.replaceChildren();

        for (const t of State.tasks) {
          const row = document.createElement("div");
          row.className = "task-item";
          row.dataset.taskId = t.id;

          const handle = document.createElement("div");
          handle.className = "task-handle";
          handle.innerHTML = `<svg class="icon"><use href="#icon-drag"></use></svg>`;

          const emojiInput = document.createElement("input");
          emojiInput.className = "input task-input-emoji";
          emojiInput.type = "text";
          emojiInput.inputMode = "text";
          emojiInput.autocomplete = "off";
          emojiInput.spellcheck = false;
          emojiInput.value = t.emoji;
          emojiInput.dataset.field = "emoji";

          const nameInput = document.createElement("input");
          nameInput.className = "input";
          nameInput.type = "text";
          nameInput.value = t.name;
          nameInput.dataset.field = "name";

          const minsInput = document.createElement("input");
          minsInput.className = "input task-input-mins";
          minsInput.type = "number";
          minsInput.min = "1";
          minsInput.value = String(t.mins);
          minsInput.dataset.field = "mins";

          const removeBtn = document.createElement("button");
          removeBtn.className = "btn-icon";
          removeBtn.dataset.action = "remove-task";
          removeBtn.dataset.id = t.id;
          removeBtn.innerHTML = `<svg class="icon" style="color:var(--accent-danger)"><use href="#icon-close"></use></svg>`;

          row.appendChild(handle);
          row.appendChild(emojiInput);
          row.appendChild(nameInput);
          row.appendChild(minsInput);
          row.appendChild(removeBtn);

          DOM.taskList.appendChild(row);
        }

        // Sortable
        if (DOM.taskList._sortable) DOM.taskList._sortable.destroy();
        DOM.taskList._sortable = new Sortable(DOM.taskList, {
          handle: ".task-handle",
          animation: 200,
          ghostClass: "sortable-ghost",
          onEnd: () => {
            const byId = new Map(State.tasks.map(t => [t.id, t]));
            const newOrder = Array.from(DOM.taskList.children)
              .map(el => byId.get(el.dataset.taskId))
              .filter(Boolean);
            State.tasks = newOrder;
            Storage.saveTasks();
            UI.renderTasks(); // 重渲染以保证一致性
          }
        });

        // emoji input auto width
        EmojiSizer.fitAll();
      },

      renderRunning() {
        const task = State.tasks[State.currentTaskIndex];
        if (!task) return;

        DOM.displayEmoji.textContent = task.emoji;
        DOM.displayName.textContent = task.name;

        this.updateTimer();
        this.updateETA();
        this.renderProgress();
        this.renderSidePanel();
        this.updatePanelTools();
      },

      updateTimer() {
        const isOT = State.isOvertime;
        const secs = isOT ? State.overtimeSeconds : State.timeLeft;

        const m = Math.floor(secs / 60);
        const s = secs % 60;
        const prefix = isOT ? "+" : "";

        DOM.displayTime.textContent = `${prefix}${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        DOM.displayTime.classList.toggle("overtime", isOT);
        DOM.overtimeLabel.classList.toggle("show", isOT);
        DOM.flowIndicator.classList.toggle("show", isOT);
        DOM.forgotBtn.classList.toggle("show", isOT);

        // Update mobile forgot button visibility
        if (DOM.mobileForgotBtn) {
          DOM.mobileForgotBtn.style.display = isOT ? "flex" : "none";
        }
      },

      updateMobilePauseBtn() {
        if (!DOM.mobilePauseIcon || !DOM.mobilePauseLabel) return;
        
        if (State.isPaused) {
          DOM.mobilePauseIcon.innerHTML = '<use href="#icon-play"></use>';
          DOM.mobilePauseLabel.textContent = "继续";
          DOM.mobilePauseBtn.classList.add("active");
        } else {
          DOM.mobilePauseIcon.innerHTML = '<use href="#icon-pause"></use>';
          DOM.mobilePauseLabel.textContent = "暂停";
          DOM.mobilePauseBtn.classList.remove("active");
        }
      },

      updateETA() {
        DOM.etaProgress.textContent = `${State.currentTaskIndex + 1}/${State.tasks.length}`;

        let remainingSecs = State.isOvertime ? 0 : State.timeLeft;
        for (let i = State.currentTaskIndex + 1; i < State.tasks.length; i++) {
          remainingSecs += (State.tasks[i].mins || 0) * 60;
        }

        const mins = Math.ceil(remainingSecs / 60);
        DOM.etaRemaining.textContent = mins > 0 ? `${mins}分钟` : "即将完成";

        const finishTime = new Date(Date.now() + remainingSecs * 1000);
        DOM.etaFinish.textContent = finishTime.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      },

      renderProgress() {
        DOM.progressTrack.replaceChildren();

        const totalMins = State.tasks.reduce((a, t) => a + (t.mins || 0), 0) || 1;

        State.tasks.forEach((t, i) => {
          const flex = (t.mins || 1) / totalMins;

          let status = "future";
          let badge = "待完成";
          if (i < State.currentTaskIndex) { status = "completed"; badge = "已完成"; }
          else if (i === State.currentTaskIndex) {
            status = State.isOvertime ? "current overtime" : "current";
            badge = State.isOvertime ? "心流中" : "进行中";
          }

          const seg = document.createElement("div");
          seg.className = `progress-segment ${status}`;
          seg.style.setProperty("--segment-flex", String(flex));
          seg.dataset.index = String(i);

          const emoji = document.createElement("span");
          emoji.className = "segment-emoji";
          emoji.textContent = t.emoji;

          seg.appendChild(emoji);

          if (i === State.currentTaskIndex) {
            const fill = document.createElement("div");
            fill.className = "segment-fill";
            fill.id = "segment-fill";
            seg.appendChild(fill);
          }

          const tooltip = document.createElement("div");
          tooltip.className = "segment-tooltip";

          const title = document.createElement("div");
          title.className = "tooltip-title";
          title.textContent = `${t.emoji} ${t.name}`;

          const time = document.createElement("div");
          time.className = "tooltip-time";
          time.textContent = `计划 ${t.mins} 分钟`;

          const badgeEl = document.createElement("div");
          badgeEl.className = `tooltip-badge ${status.split(" ")[0]}`;
          badgeEl.textContent = badge;

          tooltip.appendChild(title);
          tooltip.appendChild(time);
          tooltip.appendChild(badgeEl);

          seg.appendChild(tooltip);

          DOM.progressTrack.appendChild(seg);
        });

        this.updateProgress();
      },

      updateProgress() {
        const fill = document.getElementById("segment-fill");

        if (fill && !State.isOvertime) {
          const task = State.tasks[State.currentTaskIndex];
          const total = (task?.mins || 1) * 60;
          const elapsed = Math.max(0, total - State.timeLeft);
          fill.style.width = `${Math.min((elapsed / total) * 100, 100)}%`;
        } else if (fill) {
          fill.style.width = "100%";
        }

        const totalMins = State.tasks.reduce((a, t) => a + (t.mins || 0), 0) || 1;
        let completed = 0;

        for (let i = 0; i < State.currentTaskIndex; i++) completed += (State.tasks[i].mins || 0);

        const current = State.tasks[State.currentTaskIndex]?.mins || 0;
        const elapsedMins = State.isOvertime ? current : (current - State.timeLeft / 60);
        completed += Math.max(0, elapsedMins);

        DOM.progressPercent.textContent = `${Math.round((completed / totalMins) * 100)}%`;
      },

      renderSidePanel() {
        const active = State.tasks[State.currentTaskIndex];
        DOM.activeTaskSlot.replaceChildren();
        DOM.futureTaskList.replaceChildren();

        if (!active) return;

        const activeRow = document.createElement("div");
        activeRow.className = "side-task active";

        const aEmoji = document.createElement("span");
        aEmoji.className = "side-task-emoji";
        aEmoji.textContent = active.emoji;

        const aName = document.createElement("span");
        aName.className = "side-task-name";
        aName.textContent = active.name;

        const aEdit = document.createElement("button");
        aEdit.className = "btn-icon";
        aEdit.dataset.action = "edit-task";
        aEdit.dataset.index = String(State.currentTaskIndex);
        aEdit.innerHTML = `<svg class="icon"><use href="#icon-edit"></use></svg>`;

        activeRow.appendChild(aEmoji);
        activeRow.appendChild(aName);
        activeRow.appendChild(aEdit);
        DOM.activeTaskSlot.appendChild(activeRow);

        const futures = State.tasks.slice(State.currentTaskIndex + 1);
        if (futures.length === 0) {
          const last = document.createElement("div");
          last.style.cssText = "color:var(--text-muted);padding:var(--space-md);font-size:0.9rem;";
          last.textContent = "最后一个步骤了 🎉";
          DOM.futureTaskList.appendChild(last);
          return;
        }

        for (let i = 0; i < futures.length; i++) {
          const t = futures[i];
          const realIdx = State.currentTaskIndex + 1 + i;

          const row = document.createElement("div");
          row.className = "side-task";
          row.dataset.taskId = t.id;
          row.dataset.realIndex = String(realIdx);

          const handle = document.createElement("div");
          handle.className = "side-task-handle";
          handle.innerHTML = `<svg class="icon"><use href="#icon-drag"></use></svg>`;

          const e = document.createElement("span");
          e.className = "side-task-emoji";
          e.textContent = t.emoji;

          const n = document.createElement("span");
          n.className = "side-task-name";
          n.textContent = t.name;

          const edit = document.createElement("button");
          edit.className = "btn-icon";
          edit.dataset.action = "edit-task";
          edit.dataset.index = String(realIdx);
          edit.innerHTML = `<svg class="icon"><use href="#icon-edit"></use></svg>`;

          row.appendChild(handle);
          row.appendChild(e);
          row.appendChild(n);
          row.appendChild(edit);

          DOM.futureTaskList.appendChild(row);
        }

        if (DOM.futureTaskList._sortable) DOM.futureTaskList._sortable.destroy();
        DOM.futureTaskList._sortable = new Sortable(DOM.futureTaskList, {
          handle: ".side-task-handle",
          animation: 200,
          ghostClass: "sortable-ghost",
          onEnd: () => {
            const completed = State.tasks.slice(0, State.currentTaskIndex + 1);
            const byId = new Map(State.tasks.map(t => [t.id, t]));
            const newFutures = Array.from(DOM.futureTaskList.querySelectorAll(".side-task"))
              .map(el => byId.get(el.dataset.taskId))
              .filter(Boolean);

            State.tasks = [...completed, ...newFutures];
            Storage.saveTasks();

            UI.renderProgress();
            UI.renderSidePanel();
            UI.updateETA();
          }
        });
      },

      renderLog() {
        let md = `### 📅 Routine 执行日志 (${new Date().toLocaleDateString()})\n\n`;

        if (State.logMode === "table") {
          md += `| 状态 | 环节 | 开始 | 结束 | 计划 | 实际 | 超时 | 暂停 | 分心 |\n`;
          md += `| :--: | :-- | :--: | :--: | :--: | :--: | :--: | :--: | :--: |\n`;

          State.logs.forEach(l => {
            let status = "✅";
            if (l.aborted) status = "⏹️";
            else if (l.distracted) status = "😅";
            else if (l.overtime) status = "🌊";

            md += `| ${status} | ${l.emoji} ${l.name} | ${l.start} | ${l.end || "-"} | ${l.planned}m | ${l.actual ?? "-"}m | ${l.overtimeMins > 0 ? "+" + l.overtimeMins + "m" : "-"} | ${l.pauses > 0 ? l.pauses + "次" : "-"} | ${l.distracted ? l.distractedMins + "m" : "-"} |\n`;
          });
        } else {
          State.logs.forEach((l, i) => {
            let status = "✅";
            if (l.aborted) status = "⏹️";
            else if (l.distracted) status = "😅";
            else if (l.overtime) status = "🌊";

            // 时间戳 + 事项 + 记录
            md += `${i + 1}. ${status} ${l.start} **${l.emoji} ${l.name}**\n`;
            md += `   - 结束: ${l.end || "-"} | 计划: ${l.planned}m | 实际: ${l.actual ?? "-"}m\n`;
            if (l.pauses > 0) md += `   - 暂停: ${l.pauses}次\n`;
            if (l.distracted) md += `   - 分心: ${l.distractedMins}m\n`;
            if (l.overtime) md += `   - 心流超时: +${l.overtimeMins}m\n`;
            if (l.aborted) md += `   - 状态: 已中止\n`;
            md += `\n`;
          });
        }

        // flashes section (only when exists)
        if (State.flashes.length > 0) {
          md += `\n---\n### 💭 闪念记录\n`;
          State.flashes.forEach((f, i) => {
            const taskLabel = f.task ? `（${f.task}）` : "";
            md += `- ${f.time} ${taskLabel} ${f.text}\n`;
          });
        }

        const totalPlanned = State.logs.reduce((a, l) => a + (l.planned || 0), 0);
        const totalActual = State.logs.reduce((a, l) => a + (Number(l.actual) || 0), 0);
        const flowCount = State.logs.filter(l => l.overtime && !l.distracted).length;
        const distractCount = State.logs.filter(l => l.distracted).length;

        md += `\n---\n**📊 统计**\n`;
        md += `- 完成: ${State.logs.length} 步骤\n`;
        md += `- 时间: 计划 ${totalPlanned}m / 实际 ${Math.round(totalActual)}m\n`;
        if (flowCount > 0) md += `- 🌊 心流: ${flowCount} 次\n`;
        if (distractCount > 0) md += `- 😅 分心: ${distractCount} 次\n`;

        DOM.logContent.textContent = md;
      }
    };

    // ==================== Audio ====================
    const Audio = {
      _ctx: null,
      ensure() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return null;
          if (!this._ctx) this._ctx = new AudioContext();
          if (this._ctx.state === "suspended") this._ctx.resume();
          return this._ctx;
        } catch (e) {
          console.error("Audio init failed:", e);
          return null;
        }
      },

      // 完成/切换提示音（保留你原来的双音，但稍微复用 ctx）
      play() {
        const ctx = this.ensure();
        if (!ctx) return;

        try {
          const playTone = (freq, startTime, duration) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const filter = ctx.createBiquadFilter();

            osc.type = "sine";
            osc.frequency.value = freq;

            filter.type = "lowpass";
            filter.frequency.value = 2000;

            osc.connect(gain);
            gain.connect(filter);
            filter.connect(ctx.destination);

            const now = startTime;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.18, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.start(now);
            osc.stop(now + duration);
          };

          playTone(587.33, ctx.currentTime, 0.8);
          playTone(493.88, ctx.currentTime + 0.6, 0.8);
        } catch (e) {
          console.error("Audio Playback Failed:", e);
        }
      },

      // 柔和钟声：用三组泛音 + 低通 + 轻微抖动，避免刺耳
      playChime() {
        const ctx = this.ensure();
        if (!ctx) return;

        try {
          const now = ctx.currentTime;
          const duration = 10.0;
          const baseFreq = 432;

          // 主增益：稍微快速的 Attack，模拟"肉感"打击
          const master = ctx.createGain();
          master.gain.setValueAtTime(0, now);
          // 0.04s 是关键：比金属敲击(0.01)慢，比风琴(0.5)快，这是"包布木槌"的时间
          master.gain.linearRampToValueAtTime(0.5, now + 0.04);
          master.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          // 关键：使用 Bandpass（带通）代替 Lowpass，制造"空腔共鸣"
          const bandpass = ctx.createBiquadFilter();
          bandpass.type = "bandpass";
          bandpass.frequency.setValueAtTime(baseFreq * 1.5, now); // 聚焦在核心共鸣区
          bandpass.Q.setValueAtTime(0.5, now); // 宽泛的过滤，保持自然

          master.connect(bandpass);
          bandpass.connect(ctx.destination);

          // 重新构建：1个重低音基频 + 2个微差共振对 + 1个瞬态打击音
          const components = [
            { f: baseFreq, g: 0.7, lfoF: 0.2, w: 0.1 },        // 核心基音
            { f: baseFreq * 1.003, g: 0.4, lfoF: 0.5, w: 0.2 }, // 相位对：制造"嗡嗡"的空气晃动
            { f: baseFreq * 0.5, g: 0.3, lfoF: 0.1, w: 0.05 },  // 底座音：增加厚重感
            { f: baseFreq * 2.41, g: 0.1, lfoF: 1.5, w: 0.02 }  // 唯一的高位分量：增加辨识度
          ];

          components.forEach((p) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();

            // 振幅抖动（Wobble）
            const lfo = ctx.createOscillator();
            const lfoGain = ctx.createGain();
            lfo.frequency.setValueAtTime(p.lfoF, now);
            lfoGain.gain.setValueAtTime(p.w, now);
            lfo.connect(lfoGain);
            lfoGain.connect(g.gain);

            osc.type = "sine";
            osc.frequency.setValueAtTime(p.f, now);

            g.gain.setValueAtTime(0, now);
            // 模拟钵体被敲击后能量的迅速爆发
            g.gain.linearRampToValueAtTime(p.g, now + 0.04);
            g.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(g);
            g.connect(master);

            osc.start(now);
            lfo.start(now);
            osc.stop(now + duration);
            lfo.stop(now + duration);
          });

          // --- 核心新增：模拟"木槌撞击"的瞬态低频 ---
          const thud = ctx.createOscillator();
          const thudGain = ctx.createGain();
          thud.type = "sine";
          thud.frequency.setValueAtTime(150, now); // 低沉的撞击声
          thud.frequency.exponentialRampToValueAtTime(50, now + 0.1); // 频率迅速下滑

          thudGain.gain.setValueAtTime(0.3, now);
          thudGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2); // 极短的瞬间

          thud.connect(thudGain);
          thudGain.connect(ctx.destination); // 绕过 Master 滤镜，保持直接感
          thud.start(now);
          thud.stop(now + 0.2);

        } catch (e) {
          console.error("Singing Bowl Playback Failed:", e);
        }
      }
    };

    // ==================== Chime (active-time based) ====================
    const Chime = {
      cycle() {
        const order = [0, 15, 30, 60];
        const idx = order.indexOf(State.chimeMins);
        State.chimeMins = order[(idx + 1 + order.length) % order.length];
        Storage.saveChime();

        // when running: schedule next chime from now (active time)
        if (State.isRunning) {
          if (State.chimeMins > 0) {
            State.nextChimeAtActiveSeconds = State.routineActiveSeconds + State.chimeMins * 60;
            Audio.playChime();
            UI.toast(`敲钟已开启：每 ${State.chimeMins} 分钟一次`);
          } else {
            State.nextChimeAtActiveSeconds = null;
            UI.toast("敲钟已关闭", "error");
          }
        } else {
          UI.toast(State.chimeMins > 0 ? `敲钟：${State.chimeMins} 分钟` : "敲钟：关闭");
        }

        UI.updatePanelTools();
      },

      tick(nowMs) {
        if (!State.isRunning) return;
        if (State.isPaused) return;
        if (!State.chimeMins || State.chimeMins <= 0) return;
        if (!Number.isFinite(State.nextChimeAtActiveSeconds)) return;

        // update active seconds
        if (State.lastActiveUpdate) {
          const dt = Math.max(0, (nowMs - State.lastActiveUpdate) / 1000);
          State.routineActiveSeconds += dt;
          State.lastActiveUpdate = nowMs;
        } else {
          State.lastActiveUpdate = nowMs;
        }

        const intervalSec = State.chimeMins * 60;
        let guard = 0;
        while (State.routineActiveSeconds >= State.nextChimeAtActiveSeconds && guard++ < 5) {
          Audio.playChime();
          State.nextChimeAtActiveSeconds += intervalSec;
        }
      },

      syncActiveOnPauseToggle(isPausing) {
        const now = Date.now();
        if (isPausing) {
          // accumulate before we stop ticking
          if (State.lastActiveUpdate) {
            State.routineActiveSeconds += Math.max(0, (now - State.lastActiveUpdate) / 1000);
          }
          State.lastActiveUpdate = now;
        } else {
          State.lastActiveUpdate = now;
        }
      },

      initForRoutineStart() {
        State.routineActiveSeconds = 0;
        State.lastActiveUpdate = Date.now();
        if (State.chimeMins > 0) {
          State.nextChimeAtActiveSeconds = State.chimeMins * 60;
        } else {
          State.nextChimeAtActiveSeconds = null;
        }
        UI.updatePanelTools();
      },

      endRoutine() {
        State.lastActiveUpdate = null;
        State.nextChimeAtActiveSeconds = null;
      }
    };

    // ==================== Timer (timestamp-based) ====================
    const Timer = {
      intervalId: null,

      start() {
        this.stop();
        this.tick(); // immediate
        this.intervalId = window.setInterval(() => this.tick(), 1000);
      },

      tick() {
        if (!State.isRunning) return;
        if (State.isPaused) return;

        const task = State.tasks[State.currentTaskIndex];
        if (!task) return;

        const startTime = State.taskStats.startTime;
        if (!startTime) return;

        const now = Date.now();

        // chime tick based on active routine time
        Chime.tick(now);

        const totalElapsed = (now - startTime) / 1000;
        const activeElapsed = totalElapsed - (State.taskStats.pauseDuration || 0);

        const taskTotalSeconds = (task.mins || 1) * 60;
        const remaining = taskTotalSeconds - activeElapsed;

        if (remaining > 0) {
          State.timeLeft = Math.ceil(remaining);
          State.isOvertime = false;
        } else {
          if (!State.isOvertime) {
            State.isOvertime = true;
            Audio.play();
          }
          State.overtimeSeconds = Math.floor(Math.abs(remaining));
        }

        UI.updateTimer();
        UI.updateProgress();
        UI.updateETA();
      },

      stop() {
        if (this.intervalId) {
          clearInterval(this.intervalId);
          this.intervalId = null;
        }
      }
    };

    // ==================== App ====================
    const App = {
      startRoutine() {
        if (!State.tasks.length) {
          UI.toast("请先添加至少一个步骤", "error");
          return;
        }

        State.currentTaskIndex = 0;
        State.logs = [];
        State.flashes = [];
        State.routineStartTime = new Date();
        State.isRunning = true;

        Chime.initForRoutineStart();

        UI.showPage("running");
        this.runTask();
      },

      runTask() {
        if (State.currentTaskIndex >= State.tasks.length) {
          this.finishRoutine();
          return;
        }

        const task = State.tasks[State.currentTaskIndex];

        State.timeLeft = (task.mins || 1) * 60;
        State.isPaused = false;
        State.isOvertime = false;
        State.overtimeSeconds = 0;

        State.taskStats = {
          pauses: 0,
          pauseDuration: 0,
          pauseStart: null,
          startTime: Date.now()
        };

        DOM.statusMessage.textContent = "";
        DOM.displayTime.classList.remove("distracted");
        DOM.flowIndicator.innerHTML = "<span>🌊</span><span>心流模式 - 继续专注吧！</span>";
        DOM.pauseBtn.textContent = "暂停";

        State.logs.push({
          emoji: task.emoji,
          name: task.name,
          planned: task.mins,
          start: Utils.formatTime(new Date(State.taskStats.startTime))
        });

        UI.renderRunning();
        Timer.start();
      },

      togglePause() {
        // update chime active-time accumulator
        Chime.syncActiveOnPauseToggle(!State.isPaused);

        State.isPaused = !State.isPaused;

        if (State.isPaused) {
          State.taskStats.pauseStart = Date.now();
          State.taskStats.pauses++;
          DOM.pauseBtn.textContent = "继续";
          DOM.statusMessage.textContent = "⏸ 计时暂停中";
        } else {
          if (State.taskStats.pauseStart) {
            State.taskStats.pauseDuration += Math.round((Date.now() - State.taskStats.pauseStart) / 1000);
            State.taskStats.pauseStart = null;
          }
          DOM.pauseBtn.textContent = "暂停";
          DOM.statusMessage.textContent = "";
          Timer.tick(); // resume immediate refresh
        }

        // Update mobile pause button
        UI.updateMobilePauseBtn();
      },

      completeTask() {
        const log = State.logs[State.currentTaskIndex];
        const now = Date.now();

        log.end = Utils.formatTime(new Date(now));
        log.pauses = State.taskStats.pauses;
        log.overtime = State.isOvertime;
        log.overtimeMins = Math.round(State.overtimeSeconds / 60);

        const actualSecs = Math.round((now - State.taskStats.startTime) / 1000) - (State.taskStats.pauseDuration || 0);
        log.actual = Math.round((actualSecs / 60) * 10) / 10;

        State.currentTaskIndex++;
        Audio.play();
        this.runTask();
      },

      applyDistraction(mins) {
        const log = State.logs[State.currentTaskIndex];
        log.distracted = true;
        log.distractedMins = mins;

        DOM.displayTime.classList.add("distracted");
        DOM.flowIndicator.innerHTML = "<span>😅</span><span>已记录分心时间</span>";

        UI.toast(`已记录：分心了约 ${mins} 分钟`);
        window.setTimeout(() => this.completeTask(), 300);
      },

      stopRoutine() {
        if (State.logs.length > 0) {
          const log = State.logs[State.currentTaskIndex];
          if (log && !log.end) {
            const now = Date.now();
            log.end = Utils.formatTime(new Date(now));
            log.aborted = true;
            log.pauses = State.taskStats.pauses;

            const actualSecs = Math.round((now - State.taskStats.startTime) / 1000) - (State.taskStats.pauseDuration || 0);
            log.actual = Math.round((actualSecs / 60) * 10) / 10;
          }
        }
        this.finishRoutine();
      },

      finishRoutine() {
        Timer.stop();
        Chime.endRoutine();
        State.isRunning = false;
        UI.showPage("log");
        UI.renderLog();
      },

      togglePanel() {
        const isOpen = DOM.sidePanel.classList.toggle("open");
        DOM.panelTrigger.classList.toggle("hidden");
        
        // Mobile overlay
        if (DOM.panelOverlay) {
          DOM.panelOverlay.classList.toggle("show", isOpen);
        }
        
        UI.renderSidePanel();
        UI.updatePanelTools();
      },

      closePanel() {
        DOM.sidePanel.classList.remove("open");
        DOM.panelTrigger.classList.remove("hidden");
        if (DOM.panelOverlay) {
          DOM.panelOverlay.classList.remove("show");
        }
      },

      editTask(index) {
        const task = State.tasks[index];
        if (!task) return;

        const name = prompt("修改环节名称:", task.name);
        const minsStr = prompt("修改计划时长(分钟):", String(task.mins));

        if (name !== null && name.trim() !== "") task.name = name.trim();
        if (minsStr !== null && minsStr.trim() !== "") task.mins = Utils.clampInt(minsStr, 1, 999);

        Storage.saveTasks();

        // 若正在运行且编辑的是当前任务：不直接覆盖 timeLeft，让 Timer 统一计算
        if (State.isRunning && index === State.currentTaskIndex) {
          DOM.displayName.textContent = task.name;
          Timer.tick();
        }

        UI.renderTasks();      // 同步 setup 页
        UI.renderSidePanel();  // 同步侧边栏
        UI.renderProgress();
        UI.updateETA();
      },

      updateTaskById(taskId, field, value) {
        const t = State.tasks.find(x => x.id === taskId);
        if (!t) return;

        if (field === "mins") {
          t.mins = Utils.clampInt(value, 1, 999);
        } else if (field === "emoji") {
          t.emoji = String(value);
        } else if (field === "name") {
          t.name = String(value);
        }

        Storage.saveTasks();
      },

      addTask() {
        State.tasks.push({ id: Utils.uid(), emoji: "✨", name: "新环节", mins: 5 });
        Storage.saveTasks();
        UI.renderTasks();
      },

      removeTaskById(id) {
        State.tasks = State.tasks.filter(t => t.id !== id);
        Storage.saveTasks();
        UI.renderTasks();
      },

      exportConfig() {
        const preset = State.presets.find(p => p.id === State.currentPresetId);
        const config = {
          version: "1.0",
          exportedAt: new Date().toISOString(),
          name: preset?.name || "未命名流程",
          tasks: Utils.deepClone(State.tasks)
        };

        const blob = new Blob([JSON.stringify(config, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `flow-routine-${new Date().toLocaleDateString().replace(/\//g, "-")}.json`;
        a.click();
        URL.revokeObjectURL(url);

        UI.toast("配置已导出！");
      },

      importConfig(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const config = JSON.parse(e.target.result);
            if (!config.tasks || !Array.isArray(config.tasks)) throw new Error("无效的配置文件");

            // 确保导入任务有 id
            Storage.ensureTaskIds(config.tasks);

            let name = config.name || file.name.replace(/\.json$/i, "");
            let counter = 1;
            while (State.presets.some(p => p.name === name)) {
              name = `${config.name || "导入的流程"} (${counter++})`;
            }

            const newPreset = {
              id: "imported_" + Date.now(),
              name,
              tasks: Utils.deepClone(config.tasks),
              createdAt: Date.now(),
              source: "imported"
            };

            State.presets.push(newPreset);
            State.tasks = Utils.deepClone(config.tasks);
            State.currentPresetId = newPreset.id;

            Storage.savePresets();
            Storage.saveTasks();
            Storage.saveCurrentPreset();

            UI.renderPresets();
            UI.renderTasks();
            UI.toast(`已导入「${name}」`);
          } catch (err) {
            UI.toast("导入失败：" + err.message, "error");
          }
        };
        reader.readAsText(file);
      },

      async importFromClipboard() {
        try {
          // Check if clipboard API is available
          if (!navigator.clipboard || !navigator.clipboard.readText) {
            UI.toast("浏览器不支持读取剪贴板", "error");
            return;
          }

          const text = await navigator.clipboard.readText();
          
          if (!text || !text.trim()) {
            UI.toast("剪贴板为空", "error");
            return;
          }

          let config;
          try {
            config = JSON.parse(text);
          } catch (parseErr) {
            UI.toast("剪贴板内容不是有效的 JSON", "error");
            return;
          }

          if (!config.tasks || !Array.isArray(config.tasks)) {
            UI.toast("JSON 格式无效：缺少 tasks 数组", "error");
            return;
          }

          if (config.tasks.length === 0) {
            UI.toast("JSON 中没有任务步骤", "error");
            return;
          }

          // Ensure task IDs
          Storage.ensureTaskIds(config.tasks);

          let name = config.name || "剪贴板导入";
          let counter = 1;
          while (State.presets.some(p => p.name === name)) {
            name = `${config.name || "剪贴板导入"} (${counter++})`;
          }

          const newPreset = {
            id: "clipboard_" + Date.now(),
            name,
            tasks: Utils.deepClone(config.tasks),
            createdAt: Date.now(),
            source: "imported"
          };

          State.presets.push(newPreset);
          State.tasks = Utils.deepClone(config.tasks);
          State.currentPresetId = newPreset.id;

          Storage.savePresets();
          Storage.saveTasks();
          Storage.saveCurrentPreset();

          UI.renderPresets();
          UI.renderTasks();
          UI.toast(`已从剪贴板导入「${name}」（${config.tasks.length} 步骤）`);

        } catch (err) {
          // Handle permission denied or other errors
          if (err.name === "NotAllowedError") {
            UI.toast("请允许读取剪贴板权限", "error");
          } else {
            UI.toast("导入失败：" + err.message, "error");
          }
        }
      },

      savePreset(name) {
        const newPreset = {
          id: "preset_" + Date.now(),
          name,
          tasks: Utils.deepClone(State.tasks),
          createdAt: Date.now(),
          source: "user"
        };

        State.presets.push(newPreset);
        State.currentPresetId = newPreset.id;

        Storage.savePresets();
        Storage.saveCurrentPreset();
        UI.renderPresets();
        UI.toast(`预设「${name}」已保存！`);
      },

      loadPreset(id) {
        const preset = State.presets.find(p => p.id === id);
        if (!preset) return;

        // 加载时深拷贝，避免引用串改
        const tasks = Utils.deepClone(preset.tasks || []);
        Storage.ensureTaskIds(tasks);

        State.tasks = tasks;
        State.currentPresetId = id;

        Storage.saveTasks();
        Storage.saveCurrentPreset();

        UI.renderTasks();
        UI.renderPresets();
        UI.toast(`已加载「${preset.name}」`);
      },

      deletePreset(id) {
        const preset = State.presets.find(p => p.id === id);
        if (!preset) return;
        if (!confirm(`确定要删除「${preset.name}」吗？`)) return;

        State.presets = State.presets.filter(p => p.id !== id);
        if (State.currentPresetId === id) State.currentPresetId = null;

        Storage.savePresets();
        Storage.saveCurrentPreset();
        UI.renderPresets();
        UI.toast("预设已删除", "error");
      },

      openFlash() {
        if (!State.isRunning) {
          UI.toast("请先开始执行再记录闪念", "error");
          return;
        }
        DOM.flashModal.classList.add("show");
        DOM.flashInput.value = "";
        DOM.flashInput.focus();
      },

      saveFlash() {
        const text = Utils.safeTrim(DOM.flashInput.value);
        if (!text) {
          UI.toast("请输入内容", "error");
          return;
        }

        const task = State.tasks[State.currentTaskIndex];
        const taskLabel = task ? `${task.emoji} ${task.name}` : "";

        State.flashes.push({
          time: Utils.formatTime(new Date()),
          task: taskLabel,
          text
        });

        DOM.flashModal.classList.remove("show");
        UI.updatePanelTools();
        UI.toast("闪念已记录 ✅");
      }
    };

    // ==================== Events ====================
    function setupEvents() {
      document.addEventListener("click", (e) => {
        const actionEl = e.target.closest("[data-action]");
        const action = actionEl?.dataset.action;
        if (!action) return;

        switch (action) {
          case "start": App.startRoutine(); break;
          case "add-task": App.addTask(); break;
          case "remove-task": App.removeTaskById(actionEl.dataset.id); break;

          case "export": App.exportConfig(); break;
          case "import": DOM.fileInput.click(); break;
          case "import-clipboard": App.importFromClipboard(); break;

          case "save-preset":
            DOM.saveModal.classList.add("show");
            DOM.presetNameInput.value = "";
            DOM.presetNameInput.focus();
            break;
          case "cancel-save":
            DOM.saveModal.classList.remove("show");
            break;
          case "confirm-save": {
            const name = DOM.presetNameInput.value.trim();
            if (!name) { UI.toast("请输入名称", "error"); break; }
            App.savePreset(name);
            DOM.saveModal.classList.remove("show");
            break;
          }

          case "load-preset":
            App.loadPreset(actionEl.dataset.id);
            break;
          case "delete-preset":
            App.deletePreset(actionEl.dataset.id);
            break;

          case "pause": App.togglePause(); break;
          case "complete": App.completeTask(); break;

          case "forgot":
            DOM.distractionModal.classList.add("show");
            DOM.customDistractionInput.value = "";
            DOM.customDistractionInput.focus();
            break;
          case "cancel-distraction":
            DOM.distractionModal.classList.remove("show");
            break;
          case "apply-custom-distraction": {
            const mins = Utils.clampInt(DOM.customDistractionInput.value, 1, 999);
            if (mins > 0) {
              DOM.distractionModal.classList.remove("show");
              App.applyDistraction(mins);
            } else {
              UI.toast("请输入有效的分钟数", "error");
            }
            break;
          }

          case "stop": App.stopRoutine(); break;
          case "close-panel": App.closePanel(); break;

          // Mobile actions
          case "mobile-pause": App.togglePause(); break;
          case "mobile-menu": App.togglePanel(); break;
          case "mobile-forgot":
            DOM.distractionModal.classList.add("show");
            DOM.customDistractionInput.value = "";
            break;

          case "edit-task":
            App.editTask(Number.parseInt(actionEl.dataset.index, 10));
            break;

          case "copy-log":
            navigator.clipboard.writeText(DOM.logContent.textContent);
            UI.toast("已复制 Markdown 日志！");
            break;

          case "restart":
            location.reload();
            break;

          // new: flash + chime
          case "open-flash":
            App.openFlash();
            break;
          case "cancel-flash":
            DOM.flashModal.classList.remove("show");
            break;
          case "save-flash":
            App.saveFlash();
            break;
          case "toggle-chime":
            Chime.cycle();
            break;
        }
      });

      DOM.distractionGrid.addEventListener("click", (e) => {
        const option = e.target.closest(".distraction-option");
        if (!option) return;
        DOM.distractionModal.classList.remove("show");
        App.applyDistraction(Utils.clampInt(option.dataset.mins, 1, 999));
      });

      DOM.panelTrigger.addEventListener("click", () => App.togglePanel());

      // Mobile overlay click to close panel
      if (DOM.panelOverlay) {
        DOM.panelOverlay.addEventListener("click", () => App.closePanel());
      }

      // 任务输入：用 input 实时写回，避免 change+index 的偶发错写
      DOM.taskList.addEventListener("input", (e) => {
        const input = e.target;
        const field = input.dataset.field;
        if (!field) return;

        const row = input.closest(".task-item");
        const taskId = row?.dataset.taskId;
        if (!taskId) return;

        App.updateTaskById(taskId, field, input.value);

        if (field === "emoji") EmojiSizer.fit(input);
      });

      // mins：离开时再强制修正显示值（比如输入空/0）
      DOM.taskList.addEventListener("change", (e) => {
        const input = e.target;
        if (input.dataset.field !== "mins") return;

        const row = input.closest(".task-item");
        const taskId = row?.dataset.taskId;
        if (!taskId) return;

        App.updateTaskById(taskId, "mins", input.value);
        const t = State.tasks.find(x => x.id === taskId);
        input.value = String(t?.mins ?? 1);
      });

      DOM.fileInput.addEventListener("change", (e) => {
        if (e.target.files && e.target.files[0]) {
          App.importConfig(e.target.files[0]);
          e.target.value = "";
        }
      });

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          State.logMode = btn.dataset.tab;
          UI.renderLog();
        });
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          DOM.saveModal.classList.remove("show");
          DOM.distractionModal.classList.remove("show");
          DOM.flashModal.classList.remove("show");
        }
        if (e.key === "Enter" && DOM.saveModal.classList.contains("show")) {
          document.querySelector('[data-action="confirm-save"]').click();
        }
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && DOM.flashModal.classList.contains("show")) {
          document.querySelector('[data-action="save-flash"]').click();
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && State.isRunning && !State.isPaused) Timer.tick();
      });
    }

    // ==================== Init ====================
    function init() {
      cacheDOM();
      Storage.load();
      UI.renderTasks();
      UI.renderPresets();
      UI.updatePanelTools();
      setupEvents();
    }
    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>

</html>

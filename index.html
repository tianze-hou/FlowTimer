<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flow Timer v1.2</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <!-- SVG icons -->
  <svg style="display:none">
    <symbol id="icon-drag" viewBox="0 0 24 24">
      <path
        d="M11 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm-2-8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 4c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" />
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24">
      <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z" />
    </symbol>
    <symbol id="icon-save" viewBox="0 0 24 24">
      <path
        d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z" />
    </symbol>
    <symbol id="icon-delete" viewBox="0 0 24 24">
      <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
    </symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24">
      <path
        d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
    </symbol>
    <symbol id="icon-table" viewBox="0 0 24 24">
      <path d="M3 3h18v18H3V3zm16 4H5v4h14V7zm0 6H5v4h14v-4z" />
    </symbol>
    <symbol id="icon-list" viewBox="0 0 24 24">
      <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z" />
    </symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24">
      <path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z" />
    </symbol>
    <symbol id="icon-note" viewBox="0 0 24 24">
      <path
        d="M16 2H8C6.9 2 6 2.9 6 4v16c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 17H9v-2h6v2zm0-4H9v-2h6v2zm0-4H9V9h6v2z" />
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24">
      <path
        d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6V11c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5S10.5 3.17 10.5 4v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" />
    </symbol>
    <symbol id="icon-clipboard" viewBox="0 0 24 24">
      <path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z" />
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
    </symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7z" />
    </symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24">
      <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
    </symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24">
      <path d="M6 6h12v12H6z" />
    </symbol>
    <symbol id="icon-help" viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z" />
    </symbol>
  </svg>

  <!-- measure span -->
  <span id="emoji-measure" aria-hidden="true"></span>

  <div id="toast"></div>

  <!-- Save preset modal -->
  <div id="save-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">💾 保存为预设</div>
      <input type="text" id="preset-name-input" class="input" placeholder="输入预设名称，如：晨间流程">
      <div class="modal-actions">
        <button class="btn btn-secondary" data-action="cancel-save">取消</button>
        <button class="btn btn-primary" data-action="confirm-save">保存</button>
      </div>
    </div>
  </div>

  <!-- Flash note modal -->
  <div id="flash-modal" class="modal-overlay">
    <div class="modal" style="max-width:520px">
      <div class="modal-header">🗒️ 闪念记录</div>
      <textarea id="flash-input" class="textarea"
        placeholder="现在脑子里突然蹦出来的想法是什么？&#10;（例如：等会记得给XX回消息 / 想起一个灵感 / 需要买的东西…）"></textarea>
      <div class="helper" id="flash-helper">会自动带上时间与当前步骤，稍后会汇总到日志里。</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" data-action="cancel-flash">取消</button>
        <button class="btn btn-primary" data-action="save-flash">保存</button>
      </div>
    </div>
  </div>

  <!-- Distraction modal -->
  <div id="distraction-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">🤔 我忘记停止了...</div>
      <p style="color: var(--text-secondary); margin-bottom: var(--space-lg);">大概是多久之前分心的？</p>
      <div class="distraction-grid" id="distraction-grid">
        <button class="distraction-option" data-mins="1"><span class="distraction-time">1分钟</span><span
            class="distraction-label">刚刚</span></button>
        <button class="distraction-option" data-mins="3"><span class="distraction-time">3分钟</span><span
            class="distraction-label">一小会儿</span></button>
        <button class="distraction-option" data-mins="5"><span class="distraction-time">5分钟</span><span
            class="distraction-label">有一阵了</span></button>
        <button class="distraction-option" data-mins="10"><span class="distraction-time">10分钟</span><span
            class="distraction-label">挺久的</span></button>
        <button class="distraction-option" data-mins="15"><span class="distraction-time">15分钟</span><span
            class="distraction-label">很久了</span></button>
        <button class="distraction-option" data-mins="30"><span class="distraction-time">30分钟</span><span
            class="distraction-label">完全忘了</span></button>
      </div>
      <div class="custom-distraction">
        <input type="number" id="custom-distraction-input" class="input" placeholder="自定义分钟数" min="1">
        <button class="btn btn-primary" data-action="apply-custom-distraction">确定</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" data-action="cancel-distraction">取消</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" accept=".json">

  <!-- Setup -->
  <div id="setup-area">
    <div class="setup-header">
      <h1>🌊 Flow Timer</h1>
      <p>神经多样性友好的心流计时器</p>
    </div>

    <div class="card">
      <div style="padding: var(--space-lg);">
        <div class="config-section">
          <div class="config-header">
            <div class="config-title">
              <svg class="icon">
                <use href="#icon-folder"></use>
              </svg>
              配置管理
            </div>
            <div class="config-actions">
              <button class="btn btn-config" data-action="export">
                <svg class="icon">
                  <use href="#icon-download"></use>
                </svg><span class="btn-text">导出</span>
              </button>
              <button class="btn btn-config" data-action="import">
                <svg class="icon">
                  <use href="#icon-upload"></use>
                </svg><span class="btn-text">导入文件</span>
              </button>
              <button class="btn btn-config" data-action="import-clipboard">
                <svg class="icon">
                  <use href="#icon-clipboard"></use>
                </svg><span class="btn-text">粘贴导入</span>
              </button>
              <button class="btn btn-config primary" data-action="save-preset">
                <svg class="icon">
                  <use href="#icon-save"></use>
                </svg><span class="btn-text">存为预设</span>
              </button>
            </div>
          </div>
          <div class="preset-list" id="preset-list"></div>
        </div>

        <div class="task-list" id="task-list"></div>
        <button class="btn-add-task" data-action="add-task">+ 添加步骤</button>
      </div>

      <div class="setup-footer" style="padding: 0 var(--space-lg) var(--space-lg);">
        <button class="btn btn-primary" data-action="start">🚀 开始执行</button>
      </div>
    </div>
  </div>

  <!-- Running -->
  <div id="running-area">
    <!-- Mobile panel overlay -->
    <div class="panel-overlay" id="panel-overlay"></div>

    <!-- Mobile bottom action bar -->
    <div class="mobile-action-bar" id="mobile-action-bar">
      <button class="mobile-action-btn" id="mobile-pause-btn" data-action="mobile-pause">
        <svg class="icon" id="mobile-pause-icon"><use href="#icon-pause"></use></svg>
        <span id="mobile-pause-label">暂停</span>
      </button>
      <button class="mobile-action-btn primary" data-action="complete">
        <svg class="icon"><use href="#icon-check"></use></svg>
        <span>完成</span>
      </button>
      <button class="mobile-action-btn" data-action="mobile-menu" style="position:relative">
        <svg class="icon"><use href="#icon-menu"></use></svg>
        <span>菜单</span>
      </button>
      <button class="mobile-action-btn danger" data-action="mobile-forgot" id="mobile-forgot-btn" style="display:none">
        <svg class="icon"><use href="#icon-help"></use></svg>
        <span>忘停了</span>
      </button>
    </div>

    <div class="eta-bar">
      <div class="eta-item"><span class="eta-label">进度</span><span class="eta-value" id="eta-progress">1/3</span></div>
      <div class="eta-divider"></div>
      <div class="eta-item"><span class="eta-label">剩余</span><span class="eta-value" id="eta-remaining">12分钟</span>
      </div>
      <div class="eta-divider"></div>
      <div class="eta-item"><span class="eta-label">完成</span><span class="eta-value" id="eta-finish">09:30</span></div>
    </div>

    <div class="panel-trigger" id="panel-trigger">
      <div class="trigger-tab">
        <div class="trigger-arrow"></div>
      </div>
    </div>

    <div id="side-panel">
      <div class="panel-header">
        <h3 class="panel-title">📋 菜单面板</h3>
        <button class="btn-icon" data-action="close-panel" aria-label="关闭面板">
          <svg class="icon">
            <use href="#icon-close"></use>
          </svg>
        </button>
      </div>

      <div class="panel-tools">
        <button class="panel-tool-btn" data-action="open-flash" id="flash-btn">
          <div class="panel-tool-left">
            <svg class="icon" style="color:var(--accent-primary-light)">
              <use href="#icon-note"></use>
            </svg>
            <div style="display:flex;flex-direction:column;min-width:0;flex:1;align-items:center;justify-content:center">
              <span class="panel-tool-title">闪念记录</span>
              <span class="panel-tool-sub">把灵感先放这里</span>
            </div>
          </div>
          <span class="panel-tool-chip" id="flash-chip">0 条</span>
        </button>

        <button class="panel-tool-btn" data-action="toggle-chime" id="chime-btn">
          <div class="panel-tool-left">
            <svg class="icon" style="color:var(--accent-purple)">
              <use href="#icon-bell"></use>
            </svg>
            <div style="display:flex;flex-direction:column;min-width:0;flex:1;align-items:center;justify-content:center">
              <span class="panel-tool-title">敲钟报时</span>
              <span class="panel-tool-sub">柔和提醒，不打断</span>
            </div>
          </div>
          <span class="panel-tool-chip" id="chime-chip">关闭</span>
        </button>
      </div>

      <div class="panel-section-label">正在进行</div>
      <div id="active-task-slot"></div>
      <div class="panel-section-label">后续任务 (可拖拽)</div>
      <div id="future-task-list"></div>

      <div class="panel-section-label">其他操作</div>
      <button class="panel-tool-btn" data-action="stop" style="border-color: var(--accent-danger);">
        <div class="panel-tool-left">
          <svg class="icon" style="color:var(--accent-danger)">
            <use href="#icon-stop"></use>
          </svg>
          <div style="display:flex;flex-direction:column;min-width:0;flex:1;align-items:center;justify-content:center">
            <span class="panel-tool-title" style="color:var(--accent-danger)">中止执行</span>
            <span class="panel-tool-sub">结束并导出日志</span>
          </div>
        </div>
      </button>
    </div>

    <div class="main-display">
      <div class="status-message" id="status-message"></div>
      <div class="task-emoji" id="display-emoji">🚀</div>
      <h2 class="task-name" id="display-name"></h2>
      <div class="flow-indicator" id="flow-indicator"><span>🌊</span><span>心流模式 - 继续专注吧！</span></div>
      <div class="timer-display" id="display-time">00:00</div>
      <div class="overtime-label" id="overtime-label">超时专注中 ⏱️</div>

      <div class="control-buttons">
        <button class="btn btn-warning btn-control" id="pause-btn" data-action="pause">暂停</button>
        <button class="btn btn-success btn-control" data-action="complete">✓ 完成步骤</button>
      </div>

      <button class="btn btn-secondary forgot-btn" id="forgot-btn" data-action="forgot">🤔 我忘记停止了</button><br>
      <button class="stop-btn" data-action="stop">中止并导出日志</button>
    </div>

    <div class="progress-container">
      <div class="progress-header">
        <span id="progress-label">任务进度</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-track" id="progress-track"></div>
    </div>
  </div>

  <!-- Log -->
  <div id="log-area">
    <div class="log-header">
      <h2>✅ 今日 Flow 已达成</h2>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="table">
        <svg class="icon">
          <use href="#icon-table"></use>
        </svg> 表格模式
      </button>
      <button class="tab-btn" data-tab="list">
        <svg class="icon">
          <use href="#icon-list"></use>
        </svg> 列表模式
      </button>
    </div>

    <pre class="log-content" id="log-content"></pre>

    <div class="log-actions">
      <button class="btn btn-primary" data-action="copy-log">复制到剪贴板</button>
      <button class="btn btn-secondary" data-action="restart">返回首页</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>

</html>
